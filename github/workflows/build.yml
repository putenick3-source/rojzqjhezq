name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Dear ImGui
        shell: pwsh
        run: git clone --depth 1 https://github.com/ocornut/imgui vendor/imgui

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (x64, Release)
        shell: pwsh
        run: cmake -B build -S . -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/RobRunOverlay.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath RobRunOverlay.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobRunOverlay-${{ github.sha }}
          path: RobRunOverlay.zip
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RobRunOverlay.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
